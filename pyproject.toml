[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miniatured-world"
version = "0.4.0"
description = "Privacy-first desktop sandbox core driven by abstract PC activity."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Tao-pyth" }
]
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
dev = ["pytest>=8.0"]

[project.scripts]
miniatured-world = "miniatured_world.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miniatured_world = ["content/defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
