[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miniatured-world"
version = "0.9.2"
description = "抽象化されたPC活動で素材が届く、プライバシー優先のデスクトップ実験マスコット。"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Tao-pyth" }
]
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7,<6.10"]
dev = ["pytest>=8.0"]
art = ["Pillow>=12.3,<13"]
packaging = ["pyinstaller>=6.22"]

[project.scripts]
miniatured-world = "miniatured_world.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miniatured_world = [
  "content/defaults.json",
  "assets/little_laboratory_background.jpg",
  "assets/little_laboratory_background.png",
  "assets/sprites_manifest.json",
  "assets/characters/alchemist_girl/*.png",
  "assets/cauldron/magic_cauldron/*.png",
  "assets/props/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
